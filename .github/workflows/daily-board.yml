# The MLB + NFL + NBA part of the daily parlay run. WNBA stays on the home machine,
# because stats.nba.com does not answer GitHub's runners (check-sources.yml). NBA moved
# here on 2026-10-18: nba_espn.py rebuilds the current season's league log from ESPN box
# scores, and KONJURE_NBA_SNAPSHOT makes every NBA reader use it instead of stats.nba.com.
#
# This runner owns parlay_log-MLB-*.json, parlay_log-NFL-*.json, game_log.json,
# weekly_picks.json (the NFL weekly board), form_log-NFL.json, edge_log-NFL.json and favorite_log-{NFL,MLB}.json,
# and since 2026-10-18 the NBA files too: parlay_log-NBA-*.json, tip_log.json, nba_weekly_picks.json,
# form_log-NBA.json, favorite_log-NBA.json, threes_log-NBA.json, the current season's
# nba_data/gamelog-NBA-* files and nba_data/espn-nba-ids.csv. It commits nothing else; the home
# runner owns the WNBA shards, favorite_log-WNBA.json and the rest of nba_data/. Disjoint files
# are what let both push without conflicts.
#
# Cron is UTC. The hours are chosen so every firing lands on the same Chicago calendar
# day in both CDT and CST: 19-23 + 0-4 UTC is 14:00-23:00 CDT and 13:00-22:00 CST. A
# firing at 05 UTC would be midnight CDT and build tomorrow's board at 00:00, the exact
# bug parlay-runner scheduling had at home. GitHub can start a scheduled run late or drop
# one under load; the hourly repeats and already_ran_today() absorb that.
name: daily board

on:
  schedule:
    - cron: "0 19-23 * * *"   # daily window, first half
    - cron: "0 0-4 * * *"     # daily window, second half (still the same Chicago day)
    - cron: "0 14 * * 0"      # Sunday early: 09:00 CDT, board up before the noon kickoffs
    - cron: "30 18 * * 0"     # Sunday late, forced: prices the late games off current lines
    # Closing prices for the noon kickoffs. CLV only counts a snapshot taken within 2h of
    # the start, and nothing ran between the 9:00 board and 13:30, so the whole early
    # slate went without a close (46 of 1,142 NFL props had one by 2026-10-11). These are
    # snapshot-only passes: today's board already exists, so already_ran_today() sends
    # them straight to snapshot_only_pass(). 10:15 and 11:30 CDT; 09:15 and 10:30 CST.
    - cron: "15 15 * * 0"
    - cron: "30 16 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Run with --force (build a board even if one exists today)"
        type: boolean
        default: false

permissions:
  contents: write

# One at a time: two runs racing would both rewrite the same shards.
concurrency:
  group: daily-board
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: America/Chicago        # the generator's "today" is a Chicago day, not UTC
      PYTHONUTF8: "1"
      KONJURE_NBA_SNAPSHOT: "1"  # NBA reads nba_data/, never stats.nba.com (it hangs here)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # Before the board: the NBA model, resolver and graders read this log.
      - name: Refresh NBA game log from ESPN
        run: python nba_espn.py

      - name: Run MLB + NFL + NBA
        run: |
          FORCE=""
          if [ "${{ github.event.schedule }}" = "30 18 * * 0" ] || [ "${{ inputs.force }}" = "true" ]; then
            FORCE="--force"
          fi
          python daily_parlay_gen.py --sports mlb,nba,nfl $FORCE

      # The NFL weekly board used to be saved only when the newsletter was built by hand,
      # so a weekend away meant a board saved on Sunday morning instead of Friday. Here it
      # locks on the first Friday firing (2 PM Chicago) and is graded once games finish.
      # log_picks() is a no-op before Friday and on a week that is already saved, so the
      # hourly repeats are harmless. Publishing stays a human step.
      - name: Weekly NFL board
        if: always()
        run: |
          python - <<'EOF'
          import weekly_picks as wp
          print("graded:", wp.grade())
          e = wp.log_picks()
          state = "saved " + str(e.get("generated")) if e.get("generated") else "not saved yet (locks Friday)"
          print(f"week {e.get('season')}-{e.get('week')}: {state}")
          EOF

      # The NBA weekly board: one night's slate, saved on the first Friday-Sunday firing from
      # 4 PM Chicago, when that night's props are up. log_picks() is a no-op before Friday,
      # in the preseason and on a week already saved. Grading runs inside the board step.
      - name: Weekly NBA board
        if: always()
        run: |
          python - <<'EOF'
          import datetime, nba_weekly_picks as nw
          if datetime.datetime.now().hour >= 16:
              e = nw.log_picks()
              print(e.get("week"), "saved" if e.get("generated") else e.get("note") or "not saved yet")
          else:
              print("before 4 PM: board not attempted")
          EOF

      - name: Commit this runner's logs
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only files that exist: form_log-NFL.json appears with the first qualifying prop,
          # and git add fails outright on a path that matches nothing.
          for f in parlay_log-MLB-*.json parlay_log-NFL-*.json parlay_log-NBA-*.json game_log.json weekly_picks.json \n                   form_log-NFL.json edge_log-NFL.json favorite_log-NFL.json favorite_log-MLB.json \n                   tip_log.json nba_weekly_picks.json form_log-NBA.json favorite_log-NBA.json threes_log-NBA.json \n                   nba_data/gamelog-NBA-$(python -c 'import parlay_model as p; print(p.nba_season_strings()[0])')-*.csv.gz \n                   nba_data/espn-nba-ids.csv; do
            if [ -e "$f" ]; then git add -- "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -q -m "chore: cloud board run $(date '+%Y-%m-%d %H:%M %Z')"
          # Drop anything else the run touched: other files belong to the home runner.
          git restore .
          for i in 1 2 3; do
            git pull --rebase -q && git push -q && exit 0
            sleep $((i * 15))
          done
          echo "Push failed after three tries."
          exit 1
