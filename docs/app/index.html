<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard · Konjure Analytics</title>
<meta name="description" content="The Konjure Analytics dashboard: projections, weekly hubs, the Edge Finder and the track record for the NFL, NBA, MLB and WNBA.">
<link rel="icon" href="../app-icon.jpg">
<style>
:root{--bg:#111318;--bar:#0f1117;--line:#232838;--text:#c8cad4;--accent:#818cf8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{display:flex;flex-direction:column}
.bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.45rem 1rem;
background:var(--bar);border-bottom:1px solid var(--line);font-size:.8rem}
.bar a{color:var(--text);text-decoration:none}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
font-size:.7rem;color:var(--accent)!important}
.brand img{width:22px;height:22px;border-radius:5px}
.links{display:flex;gap:1rem}
.links a:hover{color:var(--accent)}
.wrap{position:relative;flex:1}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
.note{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:.6rem;text-align:center;padding:1rem;font-size:.9rem;pointer-events:none}
.note small{color:#7c8196}
@media (max-width:520px){.links a.opt{display:none}}
</style></head><body>
<div class="bar">
  <a class="brand" href="../"><img src="../app-icon.jpg" alt="">Konjure Analytics</a>
  <div class="links">
    <a class="opt" href="https://konjureanalytics.beehiiv.com/subscribe">Weekly report</a>
    <a href="https://nba-prop-dashboard-dhmu5b4fonzesfkydqwznu.streamlit.app/" target="_blank" rel="noopener">Open full screen ↗</a>
  </div>
</div>
<div class="wrap">
  <div class="note"><div>Loading the dashboard…</div><small>The first load after a quiet spell can take up to a minute.</small></div>
  <iframe src="https://nba-prop-dashboard-dhmu5b4fonzesfkydqwznu.streamlit.app/?embed=true&amp;embed_options=dark_theme"
          title="Konjure Analytics dashboard" allow="clipboard-write; fullscreen"></iframe>
</div>
</body></html>
