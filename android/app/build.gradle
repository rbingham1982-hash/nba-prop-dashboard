plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing reads android/keystore.properties (gitignored, like the keystore itself):
//   storeFile=../konjure-release.jks
//   storePassword=...
//   keyAlias=konjure
//   keyPassword=...
// The passwords used to sit in this file, and the repository is public.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file("keystore.properties")
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.konjure.analytics'
    compileSdk 34

    defaultConfig {
        applicationId "com.konjure.analytics"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (keystoreProps["storeFile"]) {
                storeFile     file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias      keystoreProps["keyAlias"]
                keyPassword   keystoreProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            manifestPlaceholders = [usesCleartextTraffic: "false"]
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            // Plain http only for a local dev server (emulator 10.0.2.2, or a PC on the Wi-Fi).
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig true      // BuildConfig.DEBUG gates WebView debugging and mixed content
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
